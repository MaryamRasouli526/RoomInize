<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>RoomInize</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

</head>

<body style="background-image: url('/images/blueGold.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">

<header class="container py-4">

  <div class="glass p-3 mb-3 d-flex justify-content-center align-items-center">
    <h2>✨RoomInize</h2>
  </div>
</header>

<main class="container">

  <!-- WELCOME -->
  <section id="welcomeScreen"
           class="text-center glass p-5">

    <h1 class="mb-3">Välj rumstyp</h1>

    <button class="btn btn-lg me-2"
            style="background: linear-gradient(145deg, #7a5a00, #b8860b); color: #ffffff; border: 1px solid #d4af37; font-weight: 600;"
            aria-label="Välj sovrum"
            onclick="chooseRoom('sovrum')">
      🛏️ Sovrum
    </button>

    <button class="btn btn-lg"
            style="background: linear-gradient(145deg, #7a5a00, #b8860b); color: #ffffff; border: 1px solid #d4af37; font-weight: 600;"
            aria-label="Välj vardagsrum"
            onclick="chooseRoom('vardagsrum')">
      🛋️ Vardagsrum
    </button>

  </section>

  <!-- EDITOR -->
  <section id="roomEditor"
           style="display:none;"
           class="row mt-3 g-3">

    <!-- SIDEBAR -->
    <aside class="col-md-3">

      <div class="glass p-3">

        <h5 id="shopTitle">📦 Möbel Shop</h5>

        <div class="mb-3"
             role="toolbar"
             aria-labelledby="shopTitle">

          <button id="undoBtn"
                  class="btn btn-warning btn-sm me-1">
            ↩ Ångra
          </button>

          <button id="redoBtn"
                  class="btn btn-warning btn-sm me-2">
            ↪ Gör om
          </button>

          <br>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('ALL')">
            Allt
          </button>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('BED')">
            🛏️ Säng
          </button>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('CHAIR')">
            🪑 Stol
          </button>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('TABLE')">
            🍽️ Bord
          </button>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('SOFA')">
            🛋️ Soffa
          </button>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('STORAGE')">
            🗄️Förvaring
          </button>

          <button class="btn btn-sm btn-light category-btn"
                  onclick="filterCategory('DECORATION')">
            💡 Dekor
          </button>

        </div>

        <div id="furnitureList"
             class="list-group">
        </div>

      </div>

    </aside>

    <!-- CANVAS -->
    <section class="col-md-9">

      <div class="glass p-3">

        <h3 id="roomTitle" class="w-100 mb-3"></h3>

        <!-- ERROR -->
        <div id="error-message"
             aria-live="assertive"
             role="alert"
             class="error-box"
             style="display:none; margin-bottom:10px;">
          <div class="error-content">
            <span id="error-text"></span>
            <button onclick="closeError()">✖</button>
          </div>
        </div>

        <!--  COLORS + TEXTURES + SAVE -->
        <div class="row g-2 mb-3 align-items-end">

          <div class="col-md-2">
            <label class="small">Väggfärg</label>
            <input type="color"
                   id="wallColor"
                   class="form-control form-control-color"
                   value="#f5f5f5">
          </div>

          <div class="col-md-2">
            <label class="small">Golvfärg</label>
            <input type="color"
                   id="floorColor"
                   class="form-control form-control-color"
                   value="#e0c9a6">
          </div>

          <div class="col-md-4 d-flex justify-content-center gap-2">

            <div>
              <label class="small">Väggtextur</label>
              <select id="wallTexture" class="form-select">
                <option value="">Ingen</option>
                <option value="assets/backgrounds/wall1.jpg">Brun tegelsten</option>
                <option value="assets/backgrounds/wall2.jpg">Blå trä</option>
                <option value="assets/backgrounds/wall3.jpg">Grå tegelsten</option>
              </select>
            </div>

            <div>
              <label class="small">Golvtextur</label>
              <select id="floorTexture" class="form-select">
                <option value="">Ingen</option>
                <option value="assets/backgrounds/floor1.jpg">Trä mörk</option>
                <option value="assets/backgrounds/floor2.jpg">Trä ljus</option>
              </select>
            </div>

          </div>

          <div class="col-md-4 d-flex justify-content-end">

            <button class="btn btn-primary"
                    aria-label="Spara rum">
              💾 Spara
            </button>

          </div>

        </div>

        <canvas id="roomCanvas"
                width="800"
                height="600"></canvas>

        <!-- WCAG OBJECT LIST -->
        <div id="a11yPanel" class="glass p-2 mt-3">
          <h5>Objekt i rummet</h5>

          <div id="a11yList" role="list"></div>
        </div>

      </div>

    </section>

  </section>

</main>

<script src="js/svgNames.js"></script>
<script src="js/roomPhysics.js"></script>
<script src="js/roomInput.js"></script>
<script src="js/roomRenderer.js"></script>
<script src="js/RoomCanvas.js"></script>
<script src="js/script.js"></script>

</body>
</html>
